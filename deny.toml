# cargo-deny configuration.
# Per threat-model A7 (supply chain): pinned deps, security-reviewed,
# license-compliant.

# [graph] all-features = true was here previously. It was removed because
# krates 0.16.x (used by cargo-deny) panics when --all-features is enabled
# against the AWS SDK's legacy-rustls dep mix. Our actual feature surface
# is narrow (mostly serde derives), so the default-feature graph already
# captures the security-relevant transitive deps. Re-add and bump cargo-
# deny when krates >= 0.17.x stabilizes upstream.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Documented ignores. Each entry MUST include a reason explaining why the
# advisory is not exploitable in our usage. Revisit on every dependency
# bump and remove anything that no longer applies.
#
# A subset of these is mirrored in .cargo/audit.toml because cargo-audit
# uses its own config file. Keep the two in sync.
ignore = [
    # All three rustls-webpki 0.101.7 advisories arrive transitively via
    # aws-smithy-http-client (the AWS SDK's HTTP layer is mid-migration to
    # hyper 1.x / rustls 0.23.x, and currently pulls BOTH the modern stack
    # and the legacy hyper 0.14.x / rustls 0.21.x / rustls-webpki 0.101.x
    # stack for back-compat). We cannot resolve without dropping the AWS
    # SDK. The vulnerabilities themselves are not reachable in our usage —
    # see per-advisory reasoning below. Re-evaluate on every aws-sdk-s3
    # bump and remove these once the legacy chain is gone.
    { id = "RUSTSEC-2026-0098", reason = "URI name constraints — rustls-webpki does not expose URI-name assertion APIs and we do not use them in our S3 client paths." },
    { id = "RUSTSEC-2026-0099", reason = "Wildcard + DNS name-constraint interaction — we do not author name-constrained certificates; S3 endpoints use standard *.s3.amazonaws.com wildcard certs without name-constraint subtrees." },
    { id = "RUSTSEC-2026-0104", reason = "CRL parsing panic — we do not parse certificate revocation lists in any code path." },
    # rustls-webpki 0.102.x (RUSTSEC-2026-0049, CRL distribution-point
    # matching). Pulled in transitively via tonic 0.11 → tokio-rustls
    # 0.25 → rustls 0.22 → rustls-webpki 0.102. We don't issue or parse
    # CRLs anywhere; the only TLS code path is mTLS for the control-plane
    # gRPC server, where operators supply a client CA bundle without CRL
    # distribution points. The advisory itself notes "limited impact —
    # an attacker would need to compromise a trusted issuing authority";
    # in that scenario they could bypass revocation checking through
    # other more impactful means. Fix lands when we bump tonic 0.11 →
    # 0.12 (requires bumping prost 0.12 → 0.13 too — planned but not
    # this commit).
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki CRL distribution-point matching bug; we don't parse CRLs (mTLS uses operator-provisioned client CAs without distribution points). Fix arrives with tonic 0.12 / prost 0.13 bump." },
    # rustls-pemfile 2.2.0 (RUSTSEC-2025-0134) is *unmaintained*, not
    # vulnerable. The crate is described in its own advisory as "a thin
    # wrapper around the same code used in rustls-pki-types" — there's
    # no behavioral problem to patch. Pulled in transitively via
    # tonic 0.11 → rustls-native-certs 0.7. Same bump-tonic fix path.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained (not vulnerable); transitive via tonic 0.11's rustls-native-certs. Resolves when we bump tonic." },
    # lru 0.12.5 (RUSTSEC-2026-0002, IterMut unsoundness). aws-sdk-s3
    # depends on lru non-optionally for its internal request-cache
    # machinery — so this is in the default-feature dep graph, not just
    # under --all-features. The unsoundness is in IterMut, which is
    # called only inside the AWS SDK's cache code; we never construct an
    # lru cache or call IterMut anywhere in our codebase.
    { id = "RUSTSEC-2026-0002", reason = "Unsoundness in lru's IterMut, reachable only inside aws-sdk-s3's internal request-cache machinery; not exposed to our usage." },
    # Note: rsa (RUSTSEC-2023-0071) is only in the *all-features* dep
    # graph (transitive via sqlx-mysql, which our postgres-only feature
    # set never enables). It's listed only in .cargo/audit.toml because
    # cargo-audit reads the raw Cargo.lock without feature filtering;
    # cargo-deny doesn't see it in the default graph, so listing it here
    # would fire "advisory-not-detected".
]

[licenses]
# Allowed licenses for dependencies. Apache-2.0 is the project license; we
# accept compatible permissive licenses.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # CDLA-Permissive-2.0: Linux Foundation's permissive data license. Used
    # by the `webpki-roots` crate (which packages Mozilla's CA root cert
    # data). It's a permissive license without copyleft; safe for Apache-2.0
    # downstream distribution.
    "CDLA-Permissive-2.0",
]
# Removed since not present in current dep graph (cargo-deny warns on
# unmatched allowances; cleaner to keep tight):
#   - Unicode-DFS-2016
#   - MPL-2.0
# Re-add either if a future dep brings them back.
confidence-threshold = 0.93

[[licenses.exceptions]]
name = "ring"
allow = ["ISC", "MIT", "OpenSSL"]

[bans]
# multiple-versions: set to "allow" while the AWS SDK is mid-migration
# from the legacy hyper 0.14 / rustls 0.21 stack to the modern hyper 1.x /
# rustls 0.23 stack — that single transition is responsible for ~30
# duplicate-version warnings (hyper, rustls, rustls-webpki, tokio-rustls,
# h2, http, http-body, hyper-rustls, and every transitive crate they
# touch). A second cluster comes from ecosystem-wide major-version
# churn in the digest/sha2 family and rand. None are our doing and none
# are actionable today; the warnings drown out signal that would actually
# matter (e.g., a duplicate we accidentally introduced ourselves).
#
# Re-enable as "warn" or "deny" once:
#   - aws-sdk-s3 has finished migrating off hyper 0.14 + rustls 0.21
#   - the digest 0.10/0.11 split has settled across our transitive graph
multiple-versions = "allow"
wildcards = "deny"
deny = [
    # OpenSSL — we use rustls (per ADR 0001 crypto baseline).
    { name = "openssl" },
    { name = "openssl-sys" },
    # Sole-maintainer micro-packages we don't want in critical paths
    # (per threat-model A7 mitigations). Add as discovered.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
