name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1
  # Pinned sui-rust-sdk commit checked out as a sibling to this repo on
  # CI runners. The workspace Cargo.toml has path deps at
  # `../sui-rust-sdk/crates/*` (see the comment block in Cargo.toml for
  # why we're on a local checkout rather than crates.io 0.3.0). Locally,
  # contributors clone next to Yutha; in CI, the "Clone sui-rust-sdk"
  # step below does the same. Bump this rev when the local pin moves.
  SUI_RUST_SDK_REV: 5b41bc701525f1b94f1fe63008d4841bc6fb1065

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sui-rust-sdk (sibling path dep)
        run: |
          git clone https://github.com/MystenLabs/sui-rust-sdk ../sui-rust-sdk
          git -C ../sui-rust-sdk checkout "$SUI_RUST_SDK_REV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Deliberately NOT `--all`: rustfmt's `--all` flag formats workspace
      # members AND their local path-based dependencies, which would walk
      # into ../sui-rust-sdk and enforce our fmt rules on upstream code.
      # Plain `cargo fmt --check` uses `cargo metadata --no-deps` and
      # stays inside our workspace.
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sui-rust-sdk (sibling path dep)
        run: |
          git clone https://github.com/MystenLabs/sui-rust-sdk ../sui-rust-sdk
          git -C ../sui-rust-sdk checkout "$SUI_RUST_SDK_REV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    name: build (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - "1.75" # MSRV — bumps require ADR amendment per ADR 0001.
    steps:
      - uses: actions/checkout@v4
      - name: Clone sui-rust-sdk (sibling path dep)
        run: |
          git clone https://github.com/MystenLabs/sui-rust-sdk ../sui-rust-sdk
          git -C ../sui-rust-sdk checkout "$SUI_RUST_SDK_REV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Clone sui-rust-sdk (sibling path dep)
        run: |
          git clone https://github.com/MystenLabs/sui-rust-sdk ../sui-rust-sdk
          git -C ../sui-rust-sdk checkout "$SUI_RUST_SDK_REV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run unit and integration tests
        run: cargo test --workspace --all-features
        env:
          # Postgres backend conformance + pagination tests gate on
          # YUTHA_PG_TEST_URL (deliberately not DATABASE_URL — see
          # backends/postgres-receipt/tests/conformance.rs).
          YUTHA_PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  interop-go:
    name: interop (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # Caching is skipped until go.sum is committed (first
          # `go mod tidy` produces it). Flip `cache: true` and add
          # cache-dependency-path: interop/go/go.sum once it's in the repo.
          cache: false
      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Regenerate bindings + run differential vectors
        working-directory: interop/go
        run: make all

  conformance:
    name: conformance suite (in-memory backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sui-rust-sdk (sibling path dep)
        run: |
          git clone https://github.com/MystenLabs/sui-rust-sdk ../sui-rust-sdk
          git -C ../sui-rust-sdk checkout "$SUI_RUST_SDK_REV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run conformance suite (in-memory backend)
        run: cargo test --package yutha-conformance --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sui-rust-sdk (sibling path dep)
        run: |
          git clone https://github.com/MystenLabs/sui-rust-sdk ../sui-rust-sdk
          git -C ../sui-rust-sdk checkout "$SUI_RUST_SDK_REV"
      - uses: dtolnay/rust-toolchain@stable
      # We install cargo-deny directly instead of using
      # EmbarkStudios/cargo-deny-action@v1, which pins an old binary that
      # has two known issues against our dep graph:
      #   (1) krates 0.16.x panics with "unable to locate aws_lc_rs for
      #       rustls@0.21.12" on the AWS SDK's legacy hyper-0.14 /
      #       rustls-0.21 stack (fixed in krates 0.17+, ships in
      #       cargo-deny 0.16+).
      #   (2) older rustsec parser doesn't understand CVSS 4.0, which the
      #       RustSec DB started emitting in 2026 (e.g. RUSTSEC-2026-0073
      #       for libcrux-poly1305). CVSS 4.0 support landed in rustsec
      #       0.31+, which ships in cargo-deny 0.18+.
      # Mirrors the cargo-audit job's "cargo install --locked" pattern.
      - run: cargo install cargo-deny --locked --version ^0.18
      # No --all-features for the same reason — the krates panic also
      # fires when --all-features expands ring/aws-lc-rs alternatives.
      - run: cargo deny check
