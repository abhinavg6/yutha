[package]
name = "yutha-attestor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pluggable external-identity verification for Yutha admission. The `Attestor` trait mediates the registration-time check that binds a Yutha agent_id to an enterprise identity provider's notion of the principal (a SPIFFE ID, an OIDC subject, etc.). `NativeAttestor` is the zero-dependency default (what hobby swarms run). Reference enterprise implementations (SPIFFE/SPIRE, OIDC) ship as separate optional crates."
readme = "README.md"

[dependencies]
yutha-core.workspace = true

async-trait.workspace = true
thiserror.workspace = true
hex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde = { workspace = true }
serde_json.workspace = true
