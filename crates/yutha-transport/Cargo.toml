[package]
name = "yutha-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Typed envelope transport for Yutha. gRPC + NATS in production; in-memory channel for tests."
readme = "README.md"

[dependencies]
yutha-core.workspace = true
yutha-crypto.workspace = true
yutha-proto.workspace = true
yutha-receipt.workspace = true
yutha-passport.workspace = true

async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
# `futures::stream::BoxStream` for Transport::subscribe's return type.
# Already in the workspace deps from the gRPC stack.
futures.workspace = true
# `tokio_stream::wrappers::ReceiverStream` wraps an mpsc::Receiver into a
# `Stream` for the Subscribe implementation in MemoryTransport.
tokio-stream = "0.1"
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "yutha-core/serde"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# `tests/vectors.rs` reads the JSON wire-fixture format from /spec/vectors/.
serde = { workspace = true }
serde_json.workspace = true
