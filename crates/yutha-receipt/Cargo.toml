[package]
name = "yutha-receipt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Append-only, content-addressed, signed receipt store for Yutha. The load-bearing wall."
readme = "README.md"

[dependencies]
yutha-core.workspace = true
yutha-crypto.workspace = true
yutha-proto.workspace = true

# Async / sync primitives.
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }

# UUIDv7 generation for ReplaySessionId. Mirrors the workspace
# convention used by AgentId / SwarmId in yutha-core.
uuid.workspace = true

# Errors.
thiserror.workspace = true

# Logging.
tracing.workspace = true

# Optional Serde derives, mirroring yutha-core. Default-on so downstream
# code gets ergonomic JSON support; opt out via `default-features = false`.
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
# Activate Serde derives on Receipt, Evidence, SignedBy, SealStatus.
# Pulls yutha-core's serde feature so shared types serialize too.
serde = ["dep:serde", "yutha-core/serde"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test.workspace = true
proptest.workspace = true
# `tests/vectors.rs` reads the JSON wire-fixture format from /spec/vectors/.
serde = { workspace = true }
serde_json.workspace = true
