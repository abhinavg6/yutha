[package]
name = "yutha-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Yutha control-plane binary. Wires memory backends into a runnable swarm skeleton."
readme = "README.md"

[[bin]]
name = "yutha"
path = "src/main.rs"

[dependencies]
yutha-core.workspace = true
yutha-crypto.workspace = true
yutha-signer.workspace = true
yutha-attestor.workspace = true
# Phase E: SPIFFE/SPIRE Attestor backend. Wired through `--attestor spiffe`
# + `--attestor-spiffe-{socket,bundle-file,audience,...}` CLI flags
# (RFC 0016 §3.7, /spec/identity-keys/attestor-spiffe.md §10). Dead-weight
# when --attestor=native (the default); construction only triggers when
# the operator explicitly opts in.
yutha-attestor-spiffe.workspace = true
yutha-proto.workspace = true
yutha-receipt.workspace = true
yutha-passport.workspace = true
yutha-capability.workspace = true
yutha-transport.workspace = true
yutha-registry.workspace = true
yutha-cedar-plus.workspace = true
# Postgres receipt backend. Operators select it at startup with
# `--receipt-backend postgres --postgres-url <url>`; defaults to the
# in-memory store for zero-config local development.
yutha-backend-postgres-receipt.workspace = true
# Sui-anchoring backend (RFC 0014 verifiability Layer 1). Wires in
# when the four `--anchor-*` flags are set; otherwise dead-weight at
# zero gas (cadence task is never spawned, RPC client never connects).
# Operators publish their own copy of the `receipt_anchor` Move
# package per RFC 0014's operator-owned model.
yutha-backend-sui-anchor.workspace = true
# sqlx pool for the Postgres backend wiring. Pulled in transitively
# by yutha-backend-postgres-receipt; declaring explicitly so the
# `PgPoolOptions` construction in main.rs doesn't depend on
# private-reexport luck.
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }

# YAML round-trip for the constitution engine-config wire format
# (RFC 0011 §9 open Q — YAML is the v1.1 human-facing form). Used
# by ConstitutionHandler::get_active to re-emit the engine config
# the operator originally activated.
serde_yaml.workspace = true

# JSON values for building EvaluationRequest.context_attrs in the
# EnvelopeHandler send path. yutha-cedar-plus's `EntityRecord.attrs`
# and `EvaluationRequest.context_attrs` are both
# `HashMap<String, serde_json::Value>` for forward-compat with
# Cedar's evolving wire format.
serde_json.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-stream = "0.1"
# `futures::StreamExt::map` is what the EnvelopeService.Subscribe handler
# uses to transform `Transport::subscribe`'s `(Envelope, Hash)` items into
# the wire `SubscribedEnvelope` shape.
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

# gRPC server stack.
tonic.workspace = true
tonic-reflection.workspace = true
prost.workspace = true

# CLI.
clap.workspace = true

# Bearer-token wire framing.
hex.workspace = true
