// Yutha shared types — depended on by every other spec.
//
// Spec version: v1.0 draft
// Status: open for RFC review
// Owners: Workstream A (Specs)
//
// See /spec/README.md for versioning, content-addressing, and crypto baseline.

syntax = "proto3";

package yutha.common.v1;

// ---------------------------------------------------------------------------
// Identifiers
// ---------------------------------------------------------------------------

// AgentId is a UUID v7 (16 bytes) identifying an agent. UUID v7 is chosen for
// time-orderable, monotonic identifiers with sufficient entropy.
//
// AgentId is NOT a secret. Authority over an agent comes from the signing key
// that produced its passport, not from knowing its ID.
message AgentId {
  bytes value = 1; // 16 bytes, UUID v7 binary encoding
}

// SwarmId is a UUID v7 identifying a swarm. Same properties as AgentId.
message SwarmId {
  bytes value = 1; // 16 bytes
}

// ReceiptId is the content-address (hash) of a receipt. See Hash.
message ReceiptId {
  Hash hash = 1;
}

// ---------------------------------------------------------------------------
// Cryptographic primitives
// ---------------------------------------------------------------------------

// HashAlgorithm allows future migration without invalidating existing content
// addresses. Default and required-supported algorithm at v1.0 is SHA-256.
enum HashAlgorithm {
  HASH_ALGORITHM_UNKNOWN = 0;
  HASH_ALGORITHM_SHA256 = 1;
  HASH_ALGORITHM_BLAKE3 = 2; // Reserved for v1.x addition; not required at v1.0.
}

// Hash is a content-address. It is the canonical hash of a canonically
// serialized message (see /spec/README.md §5).
//
// Two implementations producing the same logical message MUST produce the
// same Hash bytes.
message Hash {
  HashAlgorithm algorithm = 1;
  bytes digest = 2; // For SHA-256: exactly 32 bytes.
}

// SignatureAlgorithm allows future PQ migration. Default and required-supported
// algorithm at v1.0 is Ed25519.
enum SignatureAlgorithm {
  SIGNATURE_ALGORITHM_UNKNOWN = 0;
  SIGNATURE_ALGORITHM_ED25519 = 1;
  // Reserved for future PQ scheme.
  SIGNATURE_ALGORITHM_RESERVED_PQ = 2;
}

// Signature carries the algorithm, the signature bytes, and an identifier of
// the public key used. The key_fingerprint is the SHA-256 of the public key
// bytes; this allows quick lookup against a registry without having to ship
// the full key inline.
message Signature {
  SignatureAlgorithm algorithm = 1;
  bytes value = 2;            // Signature bytes; for Ed25519, exactly 64 bytes.
  bytes key_fingerprint = 3;  // SHA-256 of the public key bytes; 32 bytes.
}

// PublicKey carries an Ed25519 (or future-algorithm) public key.
message PublicKey {
  SignatureAlgorithm algorithm = 1;
  bytes value = 2; // For Ed25519: exactly 32 bytes.
}

// ---------------------------------------------------------------------------
// Time
// ---------------------------------------------------------------------------

// Timestamp records both wall-clock and monotonic time. Wall-clock is for
// human operators; monotonic is for ordering decisions where clock skew
// matters (threat-model §6 cross-cutting).
//
// Implementations MUST emit both fields. Spec-mandated comparison logic uses
// monotonic_ns; observability and audit display uses wall_clock.
message Timestamp {
  string wall_clock = 1;       // RFC 3339, e.g. "2026-05-10T19:50:00.123456789Z"
  uint64 monotonic_ns = 2;     // Nanoseconds since an implementation-defined
                               // monotonic epoch. Monotonic across a single
                               // control-plane process; the receipt store
                               // tolerates non-monotonic across process restart
                               // by relying on causal_predecessors for ordering.
}

// ---------------------------------------------------------------------------
// Causality
// ---------------------------------------------------------------------------

// CausalRef is a reference to one or more predecessor receipts. The DAG is
// emitted, not reconstructed. Every envelope and every receipt carries
// predecessors; the conformance suite verifies they are preserved end-to-end
// across registry, transport, and store boundaries.
message CausalRef {
  repeated Hash predecessors = 1;
}

// ---------------------------------------------------------------------------
// Versioning
// ---------------------------------------------------------------------------

// Version is a semver string. Spec versions evolve independently per spec.
// See /spec/README.md §3 for semantics.
message Version {
  string value = 1; // e.g. "1.0.0"
}

// ---------------------------------------------------------------------------
// Extensibility
// ---------------------------------------------------------------------------

// Extensions is a typed key-value map for forward-compatible additions.
// Keys are namespaced strings (e.g. "yutha.experimental.foo", "vendor-x.bar").
// Values are protobuf Any so vendors can add typed extensions without
// breaking deserialization for implementations that don't recognize them.
//
// Implementations MUST NOT reject a message solely because it contains an
// unrecognized extension. Conformance tests verify this property.
message Extensions {
  map<string, Any> entries = 1;
}

// Any is a typed extension value. We do not import google.protobuf.Any
// directly so the spec is self-contained; semantically identical.
message Any {
  string type_url = 1; // e.g. "type.yutha.dev/v1/SomeMessage"
  bytes value = 2;     // Serialized bytes of that type.
}

// ---------------------------------------------------------------------------
// Cost annotation
// ---------------------------------------------------------------------------

// CostAnnotation records the resource cost of an action. Used in receipts
// for cost transparency (PRD §13.2). All fields optional; an implementation
// records what it can measure.
message CostAnnotation {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 tool_call_count = 3;
  uint64 wall_time_ms = 4;
  string usd_cents_estimate = 5; // Decimal string to avoid float drift; "1.23" = 1.23 cents.
  string model_provider = 6;     // e.g. "anthropic", "openai", "google" — also used for A2 attribution.
  string model_name = 7;
  string model_version = 8;
}
