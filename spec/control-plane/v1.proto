// Yutha control-plane gRPC API — the wire protocol between SDKs and the
// control plane.
//
// Spec version: v1.0 draft
// Status: open for RFC review
// Owners: Workstream B (Control Plane), with Workstream D (SDKs)
//
// Depends on: /spec/common.proto, /spec/passport/passport-v1.proto,
//             /spec/envelope/envelope-v1.proto, /spec/receipt/receipt-v1.proto,
//             /spec/capability/capability-v1.proto,
//             /spec/topology/topology-v1.proto
// See: /spec/control-plane/rationale.md (forthcoming)
//
// Design notes:
//
// 1. The four services here are the *only* control-plane surface SDKs talk
//    to. There is no out-of-band admin API; every operation that produces
//    state change goes through one of these RPCs and produces a receipt.
//
// 2. Most request/response messages wrap the typed wire messages already
//    defined in the other spec files. This keeps the gRPC layer thin and
//    the canonical bytes contract authoritative.
//
// 3. Authentication is bearer-token-based (see `AgentBearerToken` below),
//    carried in gRPC metadata (`authorization: bearer <hex>`). Operators
//    may additionally enable mTLS at the transport layer; the two are
//    orthogonal and complementary.

syntax = "proto3";

package yutha.control_plane.v1;

import "common.proto";
import "passport/passport-v1.proto";
import "envelope/envelope-v1.proto";
import "receipt/receipt-v1.proto";
import "capability/capability-v1.proto";
import "topology/topology-v1.proto";

// ---------------------------------------------------------------------------
// Authentication
// ---------------------------------------------------------------------------

// AgentBearerToken is the application-layer identity proof an SDK presents
// to the control plane on every call. The agent mints these locally by
// signing them with its passport private key; the control plane verifies
// the signature against the agent's passport public key (resolved via the
// registered passport store).
//
// Wire format on the gRPC `authorization` metadata header is:
//   "bearer <hex-encoded-canonical-bytes>"
// where the canonical bytes are computed by clearing `signature` and
// encoding the rest with prost's deterministic encoding (same rule as
// every other signed Yutha message).
//
// Tokens are short-lived (minutes, not days). The agent re-mints on
// expiry; the SDK handles refresh transparently.
message AgentBearerToken {
  // The agent claiming this identity. MUST match the agent_id whose
  // passport public key signs this token.
  yutha.common.v1.AgentId agent_id = 1;

  // The swarm this token is valid in. The control plane rejects tokens
  // whose swarm_id doesn't match its own.
  yutha.common.v1.SwarmId swarm_id = 2;

  // When the token was minted.
  yutha.common.v1.Timestamp issued_at = 3;

  // When the token expires. Recommended ≤ 5 minutes for production;
  // longer for local-dev convenience.
  yutha.common.v1.Timestamp expires_at = 4;

  // Random nonce; prevents identical tokens being indistinguishable in
  // logs. 16 bytes from a CSPRNG.
  bytes nonce = 5;

  // Forward-compatibility hatch.
  yutha.common.v1.Extensions extensions = 200;

  // Signature over canonical_bytes(token with signature cleared), made
  // with the agent's passport private key.
  yutha.common.v1.Signature signature = 250;
}

// OperatorBearerToken is the application-layer identity proof for
// operator-level actions (today: `AdmissionService.OperatorRevoke`).
// Signed by an operator key the control plane is configured to trust
// at startup (`--operator-public-key`); the operator's private key
// stays in operator tooling and the server only ever sees the public
// key + signatures.
//
// Wire format on the `authorization` metadata header is:
//   "bearer operator <hex-encoded-canonical-bytes>"
// (See RFC 0009 §3.1 for the variant-prefix scheme; `bearer <hex>` and
// `bearer agent <hex>` continue to denote AgentBearerToken.)
//
// Same short-lived semantics as AgentBearerToken — operators re-mint
// on expiry.
message OperatorBearerToken {
  // Free-form identifier for the operator. Used only for audit-trail
  // clarity; trust is rooted in the signature verifying against a
  // configured operator public key.
  string operator_id = 1;

  // The swarm this token authorizes operator actions in. The server
  // rejects tokens with a mismatched swarm_id.
  yutha.common.v1.SwarmId swarm_id = 2;

  // When the token was minted.
  yutha.common.v1.Timestamp issued_at = 3;

  // When the token expires. Same wall-clock semantics as
  // AgentBearerToken.expires_at (RFC 0008). Recommended ≤ 5 minutes.
  yutha.common.v1.Timestamp expires_at = 4;

  // 16-byte random nonce.
  bytes nonce = 5;

  // Forward-compatibility hatch.
  yutha.common.v1.Extensions extensions = 200;

  // Signature over canonical_bytes(token with signature cleared),
  // made with an operator private key whose public counterpart the
  // control plane has been configured to trust at startup.
  yutha.common.v1.Signature signature = 250;
}

// ---------------------------------------------------------------------------
// AdmissionService — registry-facing operations
// ---------------------------------------------------------------------------

// AdmissionService handles agent lifecycle: register at swarm join,
// rotate keys, revoke. Also exposes the swarm topology (immutable for
// the swarm's lifetime — agents fetch it once and cache).
service AdmissionService {
  // Register an agent presenting a signed passport. The control plane
  // verifies the passport's self-signature, evaluates admission policy
  // against the topology, and (on accept) produces an `agent.register`
  // receipt. The response carries the receipt id; the agent can fetch
  // the receipt via ReceiptService.Get.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Self-revoke an agent. The caller MUST present an
  // `AgentBearerToken` whose agent_id matches `RevokeRequest.agent_id`
  // (cross-agent revocation on this RPC is refused with
  // `PERMISSION_DENIED`). Produces an `agent.revoke` receipt and
  // triggers active-stream tear-down (RFC 0009 §3.3) — the caller's
  // own subscribe streams close and subsequent bearer tokens reject.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);

  // Operator-level eviction of an agent. The caller MUST present an
  // `OperatorBearerToken` (see RFC 0009). Produces an
  // `agent.operator_revoke` receipt (distinct from `agent.revoke`
  // for audit clarity) and triggers the same active-stream tear-down
  // on the target. When `cascade_capabilities` is true, every
  // capability issued by or held by the target is also revoked with
  // a `capability.revoke` receipt per cap.
  //
  // Returns `FAILED_PRECONDITION: operator credentials not enabled`
  // if the server was started without `--operator-public-key`.
  rpc OperatorRevoke(OperatorRevokeRequest) returns (OperatorRevokeResponse);

  // Rotate an agent's signing key. Produces an `agent.rotate_key`
  // receipt. Future tokens / envelopes / capabilities signed by the
  // agent MUST use the new key starting from the receipt's monotonic_ns.
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);

  // Get the topology of the swarm this control plane manages. Topology
  // is immutable for a swarm's lifetime; agents call this once at
  // startup and cache the result.
  rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);
}

message RegisterRequest {
  yutha.passport.v1.Passport passport = 1;
}

message RegisterResponse {
  yutha.passport.v1.RegistrationResult result = 1;
}

message RevokeRequest {
  yutha.common.v1.AgentId agent_id = 1;
  // Free-form human reason for the revocation. Persisted in the
  // receipt's evidence.
  string reason = 2;
}

message RevokeResponse {
  // Content-address of the `agent.revoke` receipt.
  yutha.common.v1.Hash revocation_receipt = 1;
}

message OperatorRevokeRequest {
  // Target agent to evict. Distinct from the bearer-token agent
  // (which is implicitly the operator identity).
  yutha.common.v1.AgentId target = 1;

  // Free-form reason; persisted on the receipt's evidence.
  string reason = 2;

  // When true, the server also revokes every capability the target
  // holds (where `issuer == target` OR `subject == target`) and
  // emits a `capability.revoke` receipt per cap. Default false —
  // operators opt in explicitly when they want the audit trail.
  bool cascade_capabilities = 3;
}

message OperatorRevokeResponse {
  // Content-address of the `agent.operator_revoke` receipt.
  yutha.common.v1.Hash revocation_receipt = 1;

  // Content-addresses of any `capability.revoke` receipts produced
  // as part of the cascade. Empty when `cascade_capabilities` was
  // false or the agent held no caps.
  repeated yutha.common.v1.Hash cascade_receipts = 2;
}

message RotateKeyRequest {
  yutha.common.v1.AgentId agent_id = 1;
  yutha.common.v1.PublicKey new_public_key = 2;
  // Signature over (agent_id || new_public_key) made with the *old*
  // private key, proving the rotation is authorized. The control plane
  // verifies against the agent's *current* registered passport key
  // before accepting.
  yutha.common.v1.Signature authorization_signature = 3;
}

message RotateKeyResponse {
  // Content-address of the `agent.rotate_key` receipt.
  yutha.common.v1.Hash rotation_receipt = 1;
}

message GetTopologyRequest {}

message GetTopologyResponse {
  yutha.topology.v1.Topology topology = 1;
}

// ---------------------------------------------------------------------------
// CapabilityService — issue, attenuate, revoke, check
// ---------------------------------------------------------------------------

service CapabilityService {
  // Issue a new (root or attenuated) capability. Issuer authority is
  // checked against the bearer token: operators can mint root caps;
  // agents can attenuate from caps they hold.
  rpc Issue(IssueCapabilityRequest) returns (IssueCapabilityResponse);

  // Attenuate an existing capability into a more restricted child. The
  // child's scope is intersected with the parent's, caveats are
  // additive, and `valid_until` cannot exceed the parent's.
  rpc Attenuate(AttenuateRequest) returns (AttenuateResponse);

  // Revoke a capability. Effective immediately for the control plane's
  // own checks; propagation to federation peers is on a TTL.
  rpc Revoke(RevokeCapabilityRequest) returns (RevokeCapabilityResponse);

  // Check whether a (capability, action) pair is permitted. Stateless,
  // deterministic. Mostly used by SDKs for client-side pre-flight; the
  // control plane still re-checks on every Send.
  rpc Check(CheckRequest) returns (CheckResponse);
}

message IssueCapabilityRequest {
  // Filled in except for `signatures`; the control plane signs and
  // persists in one transaction.
  yutha.capability.v1.Capability capability = 1;
}

message IssueCapabilityResponse {
  // Content-address of the issued capability.
  yutha.common.v1.Hash capability_id = 1;
  // Content-address of the `capability.issue` receipt.
  yutha.common.v1.Hash issuance_receipt = 2;
}

message AttenuateRequest {
  // Re-uses the spec'd shape from /spec/capability/capability-v1.proto.
  yutha.capability.v1.AttenuateRequest request = 1;
}

message AttenuateResponse {
  yutha.capability.v1.AttenuateResponse response = 1;
}

message RevokeCapabilityRequest {
  yutha.capability.v1.RevokeRequest request = 1;
}

message RevokeCapabilityResponse {
  yutha.capability.v1.RevokeResponse response = 1;
}

message CheckRequest {
  yutha.capability.v1.CheckRequest request = 1;
}

message CheckResponse {
  yutha.capability.v1.CheckResponse response = 1;
}

// ---------------------------------------------------------------------------
// EnvelopeService — typed messaging
// ---------------------------------------------------------------------------

service EnvelopeService {
  // Submit a signed envelope for delivery. The control plane:
  //   1. Verifies the envelope's actor signature against the agent's
  //      registered passport public key.
  //   2. Capability-checks the action (envelope.send) against the
  //      agent's held capabilities.
  //   3. Persists an `envelope.send` receipt.
  //   4. Forwards to the recipient's subscribe stream (if any).
  //   5. On successful delivery, persists an `envelope.deliver` receipt.
  //
  // The response carries the send-receipt id immediately; the
  // deliver-receipt arrives asynchronously and can be polled via
  // ReceiptService.Query.
  rpc Send(SendEnvelopeRequest) returns (SendEnvelopeResponse);

  // Subscribe to envelopes addressed to the calling agent. The stream
  // stays open; envelopes arrive as they are delivered to the agent.
  // Cancelling the stream means "I'm no longer subscribed" — the
  // control plane stops forwarding and may buffer per the topology's
  // delivery policy.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribedEnvelope);
}

message SendEnvelopeRequest {
  // The envelope to send. `envelope.from_agent` MUST equal the bearer's
  // agent id — cross-agent sending is not permitted.
  yutha.envelope.v1.Envelope envelope = 1;

  // Content-address of the capability authorizing this send.
  //
  // Required when `Topology.require_capability_for_send` is true
  // (CLOSED-mode default). Optional in permissive topologies
  // (OPEN-mode default); when omitted under a permissive topology the
  // server skips the cap check and the send proceeds as in v1.0.
  //
  // The referenced capability MUST have been issued through this server
  // (via `CapabilityService.Issue` or `Attenuate`). The server resolves
  // `capability_id` against its store; it does not trust an inline
  // capability proto from the client.
  //
  // Server-side check: store walks the parent chain (bounded by
  // `Topology.max_capability_chain_depth`), enforces revocation +
  // validity-window, intersects scopes, evaluates caveats against an
  // `ActionDescriptor` synthesized from the envelope
  // (`action_kind = "envelope.send"`; evidence = recipient,
  // performative, payload_schema_id, tags). Result lands as a
  // `capability.check.pass` or `capability.check.deny` receipt
  // regardless of which branch is taken. On deny the send is rejected
  // with `PERMISSION_DENIED` and no `envelope.send` receipt is
  // produced.
  //
  // See `/spec/rfcs/0007-send-path-cap-check.md`.
  yutha.common.v1.Hash capability_id = 2;
}

message SendEnvelopeResponse {
  // Content-address of the `envelope.send` receipt produced by the
  // control plane. The `envelope.deliver` receipt's content-address
  // arrives asynchronously; query ReceiptService with the
  // ByPredecessor variant on this send_receipt to find it.
  yutha.common.v1.Hash send_receipt = 1;
}

message SubscribeRequest {
  // Optional: only receive envelopes addressed to this agent. Defaults
  // to the bearer-token's agent_id; an explicit value here MUST equal
  // that agent_id or the stream is rejected.
  yutha.common.v1.AgentId agent_id = 1;
}

message SubscribedEnvelope {
  yutha.envelope.v1.Envelope envelope = 1;
  // Content-address of the `envelope.deliver` receipt produced when
  // this envelope was forwarded.
  yutha.common.v1.Hash deliver_receipt = 2;
}

// ---------------------------------------------------------------------------
// ReceiptService — read access to the audit log
// ---------------------------------------------------------------------------

service ReceiptService {
  // Fetch a single receipt by content-address.
  rpc Get(GetReceiptRequest) returns (GetReceiptResponse);

  // Run a structured query against the receipt store. Supports the same
  // query variants as the receipt store trait (by-id, by-predecessor,
  // by-agent, by-action-kind, by-time-range), with keyset pagination
  // via opaque page tokens.
  rpc Query(QueryReceiptsRequest) returns (QueryReceiptsResponse);
}

message GetReceiptRequest {
  yutha.common.v1.Hash receipt_id = 1;
}

message GetReceiptResponse {
  yutha.receipt.v1.Receipt receipt = 1;
}

message QueryReceiptsRequest {
  yutha.receipt.v1.QueryRequest query = 1;
}

message QueryReceiptsResponse {
  repeated yutha.receipt.v1.Receipt receipts = 1;
  // Opaque next-page cursor. Pass back on the next call to continue.
  // Empty when the page is the last.
  bytes next_page_token = 2;
}

// ---------------------------------------------------------------------------
// ConstitutionService — operator publishes constitutions; agents query them
// ---------------------------------------------------------------------------
//
// The constitution layer (RFCs 0010-0013) lives one layer above
// capabilities: capabilities answer "who has authority"; constitutions
// answer "what authority is permitted to be exercised right now by this
// principal under our norms." Activate publishes a freshly-authored
// constitution; the active constitution is what EnvelopeService.Send
// + CapabilityService.Issue / Attenuate / Revoke evaluate against.
//
// Authorization: Activate requires an OperatorBearerToken (RFC 0009);
// GetActive requires any AgentBearerToken (registered agents need to
// know what they're bound to).

service ConstitutionService {
  // Publish a constitution. Replaces the currently-active constitution
  // for the swarm. Runs the full load-time validation pass from RFC
  // 0012 §3.3 (structural checks, named-predicate resolution, Cedar
  // Validator in Strict mode, load-time bound enforcement) before the
  // activation lands. On success, a `constitution.activate` receipt
  // is appended and the returned hash content-addresses the
  // activated constitution.
  rpc Activate(ActivateConstitutionRequest) returns (ActivateConstitutionResponse);

  // Fetch the currently-active constitution. Returns NOT_FOUND when
  // no constitution has been activated.
  rpc GetActive(GetActiveConstitutionRequest) returns (GetActiveConstitutionResponse);
}

// A constitution artifact carried over the wire. The wire shape
// mirrors the in-process Constitution struct in `yutha-cedar-plus`
// closely; canonical bytes for content addressing are the
// deterministically-serialized proto encoding (per /spec/README.md
// §5).
message Constitution {
  // Yutha spec version of the artifact format itself.
  yutha.common.v1.Version spec_version = 1;
  // The canonical Cedar+ schema version this constitution was
  // authored against. The evaluator loads schemas at this pinned
  // version per RFC 0010 §3.5.
  string schema_version = 2;
  // Semver string. Bumped on each amendment.
  string constitution_version = 3;
  // Content-address of the parent constitution; absent for the
  // swarm's genesis constitution.
  yutha.common.v1.Hash parent_version = 4;
  // The swarm this constitution governs. Single-swarm in v1.1;
  // federation arrives in Phase 4.
  yutha.common.v1.SwarmId swarm_id = 5;
  // The Cedar policy source (stock Cedar `permit` / `forbid` rules
  // plus named predicates per the `@predicate name(...)` convention
  // from extensions.md §2.4). Stored as the canonical text; the
  // evaluator parses on load.
  string cedar_source = 6;
  // The engine-side config (scoring rules, procedures, enforcement
  // rules) serialized as YAML per extensions.md §2.2 / §3.2 /
  // enforcement.md §10. Protobuf is the canonical machine-readable
  // form long-term; v1.1 ships YAML on the wire for human
  // authoring ergonomics.
  string engine_config_yaml = 7;
  // When the constitution was authored. The activate receipt's
  // occurred_at is recorded separately by the control plane.
  yutha.common.v1.Timestamp issued_at = 8;
}

message ActivateConstitutionRequest {
  Constitution constitution = 1;
}

message ActivateConstitutionResponse {
  // Content-address of the activated constitution.
  yutha.common.v1.Hash constitution_hash = 1;
  // Content-address of the constitution.activate receipt the
  // activation produced.
  yutha.common.v1.Hash activate_receipt = 2;
}

message GetActiveConstitutionRequest {}

message GetActiveConstitutionResponse {
  // The active constitution, or unset if none.
  Constitution constitution = 1;
  // Convenience: content-address of the constitution; same as a
  // re-derivation from the constitution field but pre-computed by
  // the control plane.
  yutha.common.v1.Hash constitution_hash = 2;
}
