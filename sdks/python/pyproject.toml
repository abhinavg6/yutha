[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "yutha"
version = "0.1.0a4"
description = "Python SDK for the Yutha agent-coordination control plane."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Yutha Authors" }]
keywords = ["yutha", "agents", "control-plane", "grpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

# Runtime dependencies.
#
#   - grpcio: async gRPC stack. Pinned to 1.62 to match the protobuf
#     wire format produced by tonic 0.11 on the Rust side (both use
#     protobuf 4.x semantics).
#   - protobuf: matches grpcio's compatible range.
#   - cryptography: Ed25519 signing/verify for passport-, envelope-,
#     and bearer-token signatures. Pinned to a recent stable line that
#     ships an FFI-free `Ed25519PrivateKey` API.
#   - pydantic v2: ergonomic types (Passport, Envelope, Capability)
#     with validation. LangGraph already brings pydantic in; we don't
#     create an extra constraint by adopting it here.
dependencies = [
    # grpcio 1.66+ aligns with the protobuf 6.x runtime that
    # grpcio-tools' generated code now expects (the stubs embed a
    # `ValidateProtobufRuntimeVersion(...)` call that fails closed if
    # the runtime is older than the gencode).
    "grpcio>=1.66,<2.0",
    "protobuf>=6.30,<7.0",
    "cryptography>=42",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
# LangGraph framework integration. Users who want
# `yutha.langgraph.*` install via `pip install 'yutha[langgraph]'`;
# users who only need the core SDK don't pay for the LangGraph
# transitive deps (langchain-core, langsmith, etc.).
#
# Pin to a range that matches the surface 4b is built against. We
# can broaden as LangGraph stabilizes.
langgraph = [
    "langgraph>=0.2,<0.4",
]

# CrewAI framework integration. Users who want `yutha.crewai.*`
# install via `pip install 'yutha[crewai]'`. CrewAI 0.x carries
# LangChain + several embedding-model SDKs + transitive HTTP
# clients; keeping it out of the runtime deps means a 50%+ slimmer
# install for users on the core SDK or langgraph-only paths.
#
# Pin to the 0.x series; we can broaden as CrewAI stabilizes.
crewai = [
    "crewai>=0.70,<1.0",
]

# OpenAI Agents framework integration. Users who want
# `yutha.openai_agents.*` install via
# `pip install 'yutha[openai-agents]'`. The package is published on
# PyPI as `openai-agents` but the importable module is `agents`
# (not `openai_agents`) — both adapter and demo follow that
# convention.
#
# Pin to the 0.17 line (latest stable at adapter-design time);
# broaden when openai-agents stabilizes past 1.0.
openai-agents = [
    "openai-agents>=0.17,<1.0",
]

# Microsoft Agent Framework (MAF) integration. Users who want
# `yutha.maf.*` install via `pip install 'yutha[maf]'`.
#
# We deliberately depend on the narrower `agent-framework-core`
# (the base Agent/middleware surface) + `agent-framework-openai`
# (the OpenAIChatClient used by the devops_incident.py demo)
# rather than the umbrella `agent-framework` package. The
# umbrella pulls in `agent-framework-azure-ai-search`, whose
# `azure-search-documents` dependency is currently pre-release
# (11.7.0b2) — that would force every yutha installer to add
# `--prerelease=allow` to their `pip install` invocation.
# Sticking to the two sub-packages we actually use avoids that.
#
# Users who want richer MAF providers (Foundry, Azure OpenAI,
# Anthropic, etc.) can install the extras directly — e.g.
# `pip install 'yutha[maf]' agent-framework-foundry`.
#
# MAF is in active 1.x development; pin to the 1.x line and
# broaden after a 2.0 cut.
maf = [
    "agent-framework-core>=1.0,<2.0",
    "agent-framework-openai>=1.0,<2.0",
]

# Dev-only: codegen (regenerate `yutha/_proto/` from /spec/*.proto),
# linting, and test runners. Contributors install via `pip install -e
# .[dev]`; end-users only get the runtime deps above.
dev = [
    # Pinned to align with the runtime grpcio above. grpcio-tools'
    # emitted code embeds the gencode version, and the runtime refuses
    # to load gencode newer than itself.
    "grpcio-tools>=1.66,<2.0",
    "mypy-protobuf>=3.5",
    # Third-party type stubs for `grpc` / `grpc.aio`. `grpcio` itself
    # ships without inline stubs, so strict mypy needs these.
    "types-grpcio>=1.0",
    # Include all framework extras so dev environments can run
    # every adapter's tests + demos without a second install step.
    "langgraph>=0.2,<0.4",
    "crewai>=0.70,<1.0",
    "openai-agents>=0.17,<1.0",
    "agent-framework-core>=1.0,<2.0",
    "agent-framework-openai>=1.0,<2.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://yutha.ai"
Repository = "https://github.com/abhinavg6/yutha"
Documentation = "https://yutha.ai/developer/python-sdk/"
Issues = "https://github.com/abhinavg6/yutha/issues"

# --- Hatch build configuration ----------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/yutha"]

[tool.hatch.build.targets.sdist]
# Ship the codegen script and the protos in the sdist so downstream
# packagers / mirrors can regenerate from source. The generated stubs
# under src/yutha/_proto/ are committed into the wheel as well, so
# end-users never need protoc.
include = [
    "src/yutha/**/*.py",
    "src/yutha/**/*.pyi",
    "src/yutha/py.typed",
    "scripts/codegen.py",
    "README.md",
]

# --- Linting / formatting / typing ------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Generated protobuf code does not conform to ruff style — exclude it
# unconditionally so the linter is signal, not noise.
extend-exclude = ["src/yutha/_proto/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length — handled by formatter
    # __all__ in re-exporting modules is intentionally grouped by
    # topic (Crypto / Identifiers / Passport / …) rather than sorted
    # alphabetically. The grouping is a readability feature.
    "RUF022",
    # Comments routinely use em-dashes for prose punctuation; ruff
    # would otherwise flag those too via the ambiguous-unicode rules.
    # We don't want en-dashes (number ranges) but we DO want em-dashes
    # in commentary, and there's no per-codepoint knob — so we silence
    # the lint and rely on review to catch real ambiguity.
    "RUF001", "RUF002", "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
# Protobuf-generated code has its own (looser) typing conventions;
# don't fail the type-check on it.
exclude = ["^src/yutha/_proto/"]

[[tool.mypy.overrides]]
module = "yutha._proto.*"
ignore_errors = true

# LangGraph and its transitive deps don't ship type stubs that mypy's
# strict mode would accept. We let them flow through as `Any` at the
# import boundary; the `yutha.langgraph.*` modules we author still
# get strict-checked, so the types we define ourselves are signal.
[[tool.mypy.overrides]]
module = [
    "langgraph",
    "langgraph.*",
    "langchain_core",
    "langchain_core.*",
]
ignore_missing_imports = true

# Same treatment for CrewAI's tree. CrewAI 0.x doesn't ship type
# stubs strict-mypy would accept, and its transitive deps
# (langchain, embeddings clients) are even patchier. The
# `yutha.crewai.*` modules we author still get strict-checked.
[[tool.mypy.overrides]]
module = [
    "crewai",
    "crewai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running yutha control plane (skipped by default)",
]
filterwarnings = [
    # LangGraph 0.2/0.3 fires a LangChainPendingDeprecationWarning at
    # import time from `langgraph.checkpoint.serde.jsonplus` — we
    # don't use checkpointing, but the warning lands whenever
    # `langgraph.graph` is imported. Upstream noise; filter by the
    # exact LangChain class (which inherits from PendingDeprecationWarning,
    # but the broader category alone doesn't catch it under pytest's
    # default filter chain).
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
