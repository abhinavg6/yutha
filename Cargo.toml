[workspace]
resolver = "2"
members = [
    "crates/yutha-proto",
    "crates/yutha-core",
    "crates/yutha-crypto",
    "crates/yutha-signer",
    "crates/yutha-attestor",
    "crates/yutha-receipt",
    "crates/yutha-conformance",
    "crates/yutha-passport",
    "crates/yutha-capability",
    "crates/yutha-transport",
    "crates/yutha-registry",
    "crates/yutha-control-plane",
    "crates/yutha-cedar-plus",
    "crates/yutha-ops",
    "crates/yutha-signer-vault",
    "crates/yutha-signer-gcp-kms",
    "crates/yutha-signer-azure-kv",
    "crates/yutha-attestor-spiffe",
    "crates/yutha-attestor-oidc",
    "backends/postgres-receipt",
    "backends/s3-blob",
    "backends/sui-anchor",
    "backends/walrus-receipt",
]

# Crates not yet started (Workstream B + later) are intentionally absent.
# They will be added as their work begins.

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/abhinavg6/yutha"
homepage = "https://yutha.ai"
authors = ["The Yutha Authors"]

[workspace.dependencies]
# Internal crates — pinned by path during workspace dev.
yutha-proto = { path = "crates/yutha-proto", version = "0.1.0-alpha.1" }
yutha-core = { path = "crates/yutha-core", version = "0.1.0-alpha.1" }
yutha-crypto = { path = "crates/yutha-crypto", version = "0.1.0-alpha.1" }
yutha-signer = { path = "crates/yutha-signer", version = "0.1.0-alpha.1" }
yutha-attestor = { path = "crates/yutha-attestor", version = "0.1.0-alpha.1" }
yutha-attestor-spiffe = { path = "crates/yutha-attestor-spiffe", version = "0.1.0-alpha.1" }
yutha-attestor-oidc = { path = "crates/yutha-attestor-oidc", version = "0.1.0-alpha.1" }
yutha-receipt = { path = "crates/yutha-receipt", version = "0.1.0-alpha.1" }
yutha-conformance = { path = "crates/yutha-conformance", version = "0.1.0-alpha.1" }
yutha-passport = { path = "crates/yutha-passport", version = "0.1.0-alpha.1" }
yutha-capability = { path = "crates/yutha-capability", version = "0.1.0-alpha.1" }
yutha-transport = { path = "crates/yutha-transport", version = "0.1.0-alpha.1" }
yutha-registry = { path = "crates/yutha-registry", version = "0.1.0-alpha.1" }
yutha-cedar-plus = { path = "crates/yutha-cedar-plus", version = "0.1.0-alpha.1" }
yutha-signer-vault = { path = "crates/yutha-signer-vault", version = "0.1.0-alpha.1" }
yutha-signer-gcp-kms = { path = "crates/yutha-signer-gcp-kms", version = "0.1.0-alpha.1" }
yutha-signer-azure-kv = { path = "crates/yutha-signer-azure-kv", version = "0.1.0-alpha.1" }
yutha-backend-postgres-receipt = { path = "backends/postgres-receipt", version = "0.1.0-alpha.1" }
yutha-backend-sui-anchor = { path = "backends/sui-anchor", version = "0.1.0-alpha.1" }

# The new modular Sui Rust SDK (https://github.com/MystenLabs/sui-rust-sdk).
# Pulled in here rather than per-crate so we have one source of truth.
#
# Pinned to a local checkout sitting next to this repo because:
#   1. crates.io 0.3.0 of sui-crypto does NOT expose the `bech32` feature
#      gate; the unreleased work in the SDK trunk does. yutha-anchor-sui
#      needs `from_suiprivkey` to read the canonical Sui keystore format.
#   2. The local trunk is on 0.3.1 across the bundle; using a path dep
#      keeps all four crates in lockstep at whichever commit the operator
#      has checked out.
# Swap to a `git = "..."` rev pin once a 0.3.1+ tag with the bech32
# feature lands on crates.io.
# The `version = "0.3"` clauses are belt-and-suspenders against version
# drift: cargo uses the path when present (workspace dev), but the
# version constraint kicks in if a downstream consumer ever depends on
# us from crates.io. Without explicit versions, `cargo deny check` flags
# the four entries as wildcard dependencies and fails the bans gate.
sui-sdk-types = { version = "0.3", path = "../sui-rust-sdk/crates/sui-sdk-types", default-features = false }
sui-crypto = { version = "0.3", path = "../sui-rust-sdk/crates/sui-crypto", default-features = false }
sui-rpc = { version = "0.3", path = "../sui-rust-sdk/crates/sui-rpc", default-features = false }
# Leave default features ON for sui-transaction-builder: its only default
# is the `intents` feature, which is what gives us the async
# `TransactionBuilder::build(&mut sui_rpc::Client)` path that resolves
# gas via RPC. Disabling defaults would force us to do gas resolution by
# hand via `try_build`.
sui-transaction-builder = { version = "0.3", path = "../sui-rust-sdk/crates/sui-transaction-builder" }

# BCS is Sui's canonical binary serialization; used for object-id
# parsing, transaction encoding under the hood, etc.
bcs = "0.1"

# (suiprivkey1… Bech32 parsing comes via sui-crypto's `bech32` feature
# rather than a direct bech32 dep — keeps the encoder/decoder in lockstep
# with whatever the upstream SDK considers canonical.)

# Cedar policy engine — Phase 2 constitution evaluator delegates Layer A
# gating to upstream stock cedar-policy unmodified. Per RFC 0011's
# engine-construct decision, we do NOT extend Cedar's language; we depend
# on the published crate as a black box. Pin a stable 3.x; bump cleanly
# when 4.x is justified by a feature we need.
cedar-policy = "3.4"
serde_yaml = "0.9"

# Async runtime.
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"

# Crypto baseline (per /spec/README.md §4 and ADR 0001).
ring = "0.17"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["std"] }

# Serialization.
prost = "0.12"
prost-types = "0.12"
prost-build = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# gRPC stack. tonic 0.11 pairs with prost 0.12; tonic-build wraps prost-build
# and generates the additional service stubs from proto `service` blocks.
# `tls-roots` brings in webpki-roots so server TLS works without manual CA
# config; mTLS is enabled at runtime via tonic::transport::ServerTlsConfig.
tonic = { version = "0.11", features = ["transport", "tls", "tls-roots"] }
tonic-build = "0.11"
tonic-reflection = "0.11"

# Error handling.
thiserror = "1.0"
anyhow = "1.0"

# Hex encode/decode — used for bearer-token wire framing (the
# `authorization: bearer <hex>` header on the gRPC metadata).
hex = "0.4"

# Base64 — Vault transit returns signatures in the wire format
# `vault:v1:<base64>` and public keys as base64 strings; the Vault Signer
# backend (RFC 0017 §4.1, crates/yutha-signer-vault) decodes both.
base64 = "0.22"

# HashiCorp Vault async client. RFC 0017 §4.1 pins vaultrs as the SDK for
# the `yutha-signer-vault` backend; community-maintained, MIT, no first-
# party Rust client from HashiCorp. Used only by yutha-signer-vault and
# any test crates that exercise it. Default features pull rustls so we
# don't drag in native-tls.
vaultrs = "0.8"

# Google Cloud KMS — official Google Rust SDK (googleapis/google-cloud-rust),
# used by the yutha-signer-gcp-kms backend per RFC 0017 §4.2. Built-in ADC
# + Workload Identity via the shared google-cloud-gax runtime. `bytes` is
# pulled in for the `Bytes` type the sign response returns.
google-cloud-kms-v1 = "1"
bytes = "1"

# Azure Key Vault keys — official Microsoft azure-sdk-for-rust crates
# used by the yutha-signer-azure-kv backend per RFC 0017 §4.3.
# `azure_identity` provides DefaultAzureCredential (managed identity →
# env-var SP → CLI). Both pin a single 0.x line; Microsoft is still
# stabilising the surface, so we bump on minor releases. Managed HSM
# tier is the only Azure Key Vault flavour that supports Ed25519 today.
azure_security_keyvault_keys = "0.14"
# azure_identity 0.35 is the version that depends on azure_core ^0.35
# — must match the KV crate's azure_core pin or we get two trait copies
# in the dep graph (one impl, one expected). 0.30 brings in azure_core
# 0.30.1 and breaks TokenCredential resolution. 1.0+ also exists but
# we follow the 0.35 cohort the KV crate is locked to.
azure_identity = "0.35"
# azure_core is the shared runtime/error type both KV + identity link against;
# we pin the same range the KV crate's `^0.35.0` constraint resolves against.
azure_core = "0.35"

# SPIFFE Workload Identity SDK — used by the yutha-attestor-spiffe
# backend per the SPIFFE Attestor spec at /spec/identity-keys/attestor-spiffe.md.
# `maxlambrecht/rust-spiffe` is the canonical Rust SDK as of 2026-05; it
# provides offline JWT-SVID verification (what the Attestor needs — the
# server holds the trust bundle and verifies signatures itself, NOT
# delegating to SPIRE on every call), plus a hot-rotating `JwtSource`
# built on the Workload API. Features are opt-in (the crate ships with
# none); the consumer crate enables the precise set it needs.
#
# Version: 0.15 (the current minor cohort as of 2026-05).
spiffe = { version = "0.15", default-features = false }

# OIDC JWKS parse + OIDC discovery — used by the yutha-attestor-oidc
# backend per /spec/identity-keys/attestor-oidc.md.
# `chenhunghan/jwks` is the canonical lightweight Rust JWKS crate as of
# 2026-05; it parses RSA / EC / Ed25519 / symmetric JWKS entries via
# jsonwebtoken's `jwk` module and provides one-shot `from_jwks_url` +
# `from_oidc_url` (discovery doc) fetches. 287 LOC, MIT, jsonwebtoken ^10.2.
# Yutha owns the cache + TTL + kid-miss refresh on top (in-tree at
# crates/yutha-attestor-oidc/src/jwks_cache.rs) — `jwks` is the parse
# primitive, NOT the cache. See F0 recon notes for why this crate (vs.
# `jwks_client_rs` or pure-handwritten) was selected.
#
# Sole-maintainer micro-package; 287 LOC is well within "we can vendor-
# fork if it goes dormant" range per threat-model A7's mitigation guidance.
jwks = "0.5"

# `reqwest` for the OIDC discovery-doc fetch that the jwks crate's
# `from_oidc_url` deliberately hides (it deserialises only the
# `jwks_uri` field and throws away `issuer`, but spec §6.3 / RFC 8414
# §3.3 require the Attestor to exact-match the `issuer` field against
# the operator's configured value).
#
# Configured to MATCH jwks's own reqwest pin exactly:
# `default-features = false, features = ["json", "rustls"]`
# Reasons:
# 1. We pin v0.13 to share reqwest's connection pool + TLS state with
#    jwks (one HTTP client config across both call sites).
# 2. Defaults stay OFF because reqwest's default `default-tls` feature
#    enables `native-tls`, which on Linux pulls `openssl-sys` — banned
#    by `deny.toml [bans]` per ADR 0001 (rustls-only). jwks already
#    picked `["json", "rustls"]` for the same reason; we match.
# 3. Consumer crates may layer extra features via `features = [...]`
#    additively (features unify across the same crate version).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Identifiers.
uuid = { version = "1.8", features = ["v7"] }

# Time.
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI parsing — used by binary crates that take command-line flags
# (yutha-control-plane).
clap = { version = "4.5", features = ["derive", "env"] }

# Storage backends (used by /backends crates).
#
# sqlx 0.8 split runtime and TLS into separate features. The combo here is
# `runtime-tokio` + `tls-rustls-aws-lc-rs` (matches aws-lc-rs already pulled
# in by aws-sdk-s3 — no additional crypto backend). Bumped from 0.7.x to
# 0.8.x to resolve RUSTSEC-2024-0363 (binary-protocol smuggling) and to
# drop unmaintained transitives (paste, rustls-pemfile) plus pull modern
# rustls/webpki past the 2026 webpki advisories.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "time"] }
aws-sdk-s3 = "1.30"
aws-config = "1.4"

# Test deps.
proptest = "1.4"
tokio-test = "0.4"
# Used by yutha-attestor-oidc F3 unit tests to materialise JWKS files
# in a unique temp dir per test (avoids the static-process-id races
# Phase E hit in spiffe vectors).
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

# Compile-time-checked SQL queries from sqlx need offline mode to work in CI without a live DB.
# See backends/postgres-receipt/.sqlx for the cached query metadata.
