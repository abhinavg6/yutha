# MkDocs Material site configuration.
#
# Source markdown lives under /docs/. The site builds with `mkdocs build`
# and is published to GitHub Pages on every push to main via
# .github/workflows/docs.yml. Custom domain (yutha.ai) is set via the
# CNAME file under docs/.
#
# To preview locally:
#   pip install -r requirements-docs.txt
#   mkdocs serve

site_name: Yutha
site_description: A framework-agnostic control plane for agent swarms — identity, capability, accountability, and norms.
site_url: https://yutha.ai/
site_author: Abhinav Garg

repo_name: abhinavg6/yutha
repo_url: https://github.com/abhinavg6/yutha
edit_uri: edit/main/docs/

# `/docs` already holds historical walkthroughs; we keep that as the
# source dir and let mkdocs use it directly.
docs_dir: docs

# `--strict` in CI promotes warnings (broken links, missing pages) to
# errors so we don't quietly ship a busted site.
strict: true

# Tolerate markdown files in docs/ that aren't referenced by the nav.
# Default would warn and trip strict mode. We deliberately keep this
# permissive so renames-in-flight (e.g. archived example pages staged
# for git rm) don't block the build.
validation:
  nav:
    omitted_files: ignore

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant       # SPA-style page loads (no full reload between pages)
    - navigation.tracking      # URL updates as user scrolls through anchors
    - navigation.tabs          # Top-level sections as tabs
    # navigation.sections deliberately OMITTED: with it on, nested
    # sub-groups (e.g. Operator Guide → Signer backends / Attestor
    # backends) render as bold group labels with items always shown
    # flat, which inflates the sidebar. Without it, those sub-groups
    # render as collapsible folders that start closed — operators see
    # the two group titles and click to expand the per-backend pages
    # they care about. Top-level guides (Concepts, Operator, etc.)
    # are unaffected because they're tabs, not sidebar entries.
    - navigation.indexes       # Section index pages (so /operator/ resolves to operator/index.md)
    - navigation.top           # "Back to top" button
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy        # Copy-button on every code block
    - content.code.annotate    # Inline code annotations
    - content.action.edit      # "Edit this page" link to GitHub
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/abhinavg6/yutha

markdown_extensions:
  # Admonitions and callouts.
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Code highlighting + copy.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Tabbed content (e.g. Python / Rust side-by-side examples).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, smarter punctuation, etc.
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  # Inline icon shortcodes — required for the `:material-...:` and
  # `:octicons-...:` syntax used in index.md's grid cards and CTAs.
  # Without this, those tokens render as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# Navigation. Index pages render as the landing for their section.
# Order here drives sidebar order.
nav:
  - Home: index.md
  - Concepts:
      - concepts/index.md
      - Primitives: concepts/primitives.md
      - Topology: concepts/topology.md
      - Constitution & enforcement: concepts/constitution.md
      - Verifiability: concepts/verifiability.md
  - Operator Guide:
      - operator/index.md
      - Quickstart: operator/quickstart.md
      - Authoring constitutions: operator/authoring-constitutions.md
      - Previewing rule changes:
          - Overview: operator/previewing-changes.md
          - Shadow mode (on live traffic): operator/shadow-mode.md
          - Replay (against past traffic): operator/replay.md
          - Diff two rule sets: operator/constitution-diff.md
          - Simulation (synthetic traffic): operator/simulation.md
      - Identity & credentials:
          - Operator credentials: operator/operator-credentials.md
          - Enterprise identity (end-to-end): operator/enterprise-identity.md
          - Signer backends (key custody):
              - Overview: operator/signers.md
              - Vault: operator/vault-signer.md
              - GCP KMS: operator/gcp-kms-signer.md
              - Azure Key Vault: operator/azure-kv-signer.md
          - Attestor backends (admission attestation):
              - Overview: operator/attestors.md
              - SPIFFE/SPIRE: operator/spiffe-attestor.md
              - OIDC: operator/oidc-attestor.md
      - Running in production:
          - Monitoring & receipts: operator/monitoring.md
          - Sui anchoring: operator/sui-anchoring.md
          - Deployment: operator/deployment.md
  - Developer Guide:
      - developer/index.md
      - Quickstart: developer/quickstart.md
      - Python SDK: developer/python-sdk.md
      - LangGraph: developer/langgraph.md
      - CrewAI: developer/crewai.md
      - OpenAI Agents: developer/openai-agents.md
      - Microsoft Agent Framework: developer/maf.md
      - Writing a new adapter: developer/writing-adapters.md
  - Examples:
      - examples/index.md
      - Customer support with refund cap: examples/customer-support.md
      - Code review crew with security boundaries: examples/code-review.md
      - AP & invoice processing with payment caps: examples/ap-invoice.md
      - Research crew with citation enforcement: examples/research-crew.md
      - DevOps incident-response with SRE countersign: examples/devops-incident.md
      - Procurement platform with vendor isolation: examples/procurement-platform.md
  - Reference:
      - reference/index.md
      - Specs: reference/specs.md
      - RFCs: reference/rfcs.md
      - Canonical actions: reference/canonical-actions.md
  - Community:
      - community/index.md
      - Contributing: community/CONTRIBUTING.md
      - Code of conduct: community/CODE_OF_CONDUCT.md
      - Security policy: community/SECURITY.md
      - RFC process: community/RFC_PROCESS.md
